name: ci

on:
  push:
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "pandas>=2.2" "scipy>=1.13" "scikit-learn>=1.5" "matplotlib>=3.9"
      - name: Protocol tests including the peeking positive control
        run: python bench/test_protocol.py
      - name: Search-null instrument self-check
        run: python bench/search_null.py --self-check

  pipeline:
    # Guards the multi-task pipeline: the schema that forbids merged labels, the reference
    # resolver that must halt rather than adapt, and the frozen split files. The split files are
    # data, so nothing else would notice if one were edited or regenerated with a different rule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "pandas>=2.2" "requests>=2.31" "openpyxl>=3.1"
      - name: Schema tests, including that a merged two-task table is rejected
        run: python schemas/test_task_schema.py
      - name: Reference resolver halts on a wrong reference
        run: python data_acquisition/test_resolve_mmlv_reference.py
      - name: Table S1 fetcher refuses a bot-check page served as a workbook
        run: python data_acquisition/test_fetch_doman_s1.py
      - name: Frozen split files still say what they are supposed to say
        run: python curation/test_splits.py
      - name: Input preflight reports the acquisition state without failing the build
        run: python data_acquisition/check_inputs.py --allow-missing
